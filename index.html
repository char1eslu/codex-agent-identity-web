<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Convert supported ChatGPT and Codex authentication JSON into a Codex Agent Identity auth.json." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Codex Agent Identity Web" />
    <meta property="og:description" content="Convert supported ChatGPT and Codex authentication JSON into a narrow Codex Agent Identity." />
    <meta property="og:url" content="https://id.0penAI.net/" />
    <meta property="og:image" content="https://id.0penAI.net/og-agent-id.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An ink-drop operator turns a credential scroll into a compact identity card." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Codex Agent Identity Web" />
    <meta name="twitter:description" content="Convert supported ChatGPT and Codex authentication JSON into a narrow Codex Agent Identity." />
    <meta name="twitter:image" content="https://id.0penAI.net/og-agent-id.png" />
    <title>Agent ID</title>
  </head>
  <body>
    <main class="tool-shell">
      <div class="title-row">
        <span class="brand-mark" aria-hidden="true">A</span>
        <h1>Agent ID</h1>
        <a
          class="github-link"
          href="https://github.com/catoncat/codex-agent-identity-web"
          target="_blank"
          rel="noreferrer"
          aria-label="GitHub"
          title="GitHub"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24" role="img">
            <path id="github-icon-path"></path>
          </svg>
        </a>
      </div>

      <section id="input-view" aria-labelledby="input-label">
        <div class="field-head">
          <div class="label-with-help">
            <label id="input-label" for="auth-input">认证 JSON</label>
            <span class="help-wrap">
              <button class="help-trigger" type="button" aria-label="如何获取认证 JSON">?</button>
              <span class="tooltip" role="tooltip">Web auth JSON 可从 ChatGPT 会话接口获取。<a href="https://chatgpt.com/api/auth/session" target="_blank" rel="noreferrer">打开获取</a></span>
            </span>
          </div>
          <span id="detected-type" class="detected-type" hidden></span>
        </div>
        <textarea
          id="auth-input"
          spellcheck="false"
          autocomplete="off"
          placeholder="粘贴 Web auth 或 Codex auth.json"
        ></textarea>
        <div class="input-actions">
          <span class="help-wrap">
            <button class="help-trigger" type="button" aria-label="转换时如何处理私钥">?</button>
            <span class="tooltip tooltip-above" role="tooltip">私钥在本机生成；每次请求动态签名。</span>
          </span>
          <button id="convert-button" class="primary" type="button">转换</button>
        </div>

      </section>

      <section id="progress-section" class="progress-section" hidden aria-live="polite">
        <div class="progress-line"><span id="progress-fill"></span></div>
        <div class="progress-meta">
          <strong id="progress-title">正在处理</strong>
          <span id="progress-detail"></span>
        </div>
      </section>

      <section id="result-section" hidden aria-labelledby="result-title">
        <div class="result-head">
          <div class="result-status">
            <span class="status-check" aria-hidden="true">✓</span>
            <div>
              <h2 id="result-title">已生成</h2>
              <p><span id="result-source">-</span><span class="separator">·</span><span id="result-plan">-</span></p>
            </div>
          </div>
          <button id="reset-button" class="text-button" type="button">重新转换</button>
        </div>

        <label class="output-label" for="auth-output">auth.json</label>
        <textarea id="auth-output" class="output" readonly spellcheck="false"></textarea>
        <div class="result-actions">
          <button id="copy-button" class="secondary" type="button">复制</button>
          <button id="download-button" class="primary" type="button">下载</button>
        </div>

      </section>

      <section class="usage-guide" aria-labelledby="usage-title">
        <div class="usage-heading">
          <h3 id="usage-title">在 Codex 中使用</h3>
          <span>请使用自己部署版本，确保安全处理凭据。</span>
        </div>
        <img class="usage-comic" src="/agentid-usage-comic.webp" alt="四格：生成身份文件、替换文件、开启开关、开始使用" />
        <ol class="usage-steps">
          <li>
            <span class="usage-index">1</span>
            <strong>下载</strong>
            <small>保存为 <code>auth.json</code></small>
          </li>
          <li>
            <span class="usage-index">2</span>
            <strong>替换</strong>
            <small><code>~/.codex/auth.json</code></small>
          </li>
          <li>
            <span class="usage-index">3</span>
            <strong>开启</strong>
            <small>写入配置文件</small>
          </li>
          <li>
            <span class="usage-index">4</span>
            <strong>启动</strong>
            <small>重新打开 Codex</small>
          </li>
          <li class="usage-config">
            <div class="config-head">
              <code class="config-path">~/.codex/config.toml</code>
              <button id="copy-config-button" class="text-button" type="button">复制</button>
            </div>
            <pre id="codex-config">[features]
use_agent_identity = true</pre>
          </li>
        </ol>
      </section>

      <div id="error-banner" class="error-banner" hidden role="alert">
        <span id="error-message"></span>
        <button id="dismiss-error" type="button" aria-label="关闭错误">×</button>
      </div>
    </main>
    <script type="module" src="/src/client.ts"></script>
  </body>
</html>
